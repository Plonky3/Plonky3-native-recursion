[workspace]
resolver = "2"
members = [
    "circuit",
    "verifier-arith",
    "xmss",
    "sphincs",
]

[workspace.lints]
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unused_must_use = "deny"
rust.rust_2024_incompatible_pat = "warn"
rustdoc.all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Some pedantic lints
semicolon_if_nothing_returned = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"

redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
unused_peekable = "allow"
tuple_array_conversions = "allow"
transmute_undefined_repr = "allow"
cognitive_complexity = "allow"

[workspace.dependencies]
blake3 = { version = "1.8.4", default-features = false }
hashbrown = "0.17.1"
postcard = { version = "1.1.3", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
rand = { version = "0.10.1", default-features = false }
serde = { version = "1.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
slh-dsa = { version = "0.2.0-rc.5", default-features = false }
spin = "0.12.0"
thiserror = { version = "2.0", default-features = false }
tikv-jemallocator = "0.7.0"

# Share the local arithmetic interface with upstream verifier implementations.
p3-verifier-arith = { path = "verifier-arith", version = "0.8.0" }

# Existing Plonky3 crates are fetched from the source recursion-lab revision.
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-batch-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-blake3 = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-flock = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-lookup = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }

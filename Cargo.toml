p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }

p3-whir = { git = "https://github.com/Plonky3/Plonky3", rev = "9d4e1ce0c4a5875072b354800e046ce0c17ce6e2" }

[workspace.package]
# General description field used for the sub-crates that are currently missing a description.
description = "Experimental native recursion and signature aggregation built on Plonky3."
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3-native-recursion"
homepage = "https://github.com/Plonky3/Plonky3-native-recursion"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

# Upstream verifiers and local circuits must use the same arithmetic traits.
[patch."https://github.com/Plonky3/Plonky3"]
p3-verifier-arith = { path = "verifier-arith" }

[profile.profiling]
inherits = "release"
debug = true

[profile.optimized]
inherits = "release"
lto = "thin"
codegen-units = 1
opt-level = 3
